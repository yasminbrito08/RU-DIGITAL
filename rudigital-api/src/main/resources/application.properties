spring.application.name=rudigital-api
spring.datasource.url=${DB_URL}

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.error.include-message=always
server.error.include-binding-errors=always
server.port=8090

app.jwt.secret=${JWT_SECRET:change-me-to-a-very-long-secret-key-32b-min}
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000
# Use false on local HTTP; true in production (HTTPS)
app.jwt.cookie-secure=${COOKIE_SECURE:false}
app.jwt.cookie-same-site=Strict